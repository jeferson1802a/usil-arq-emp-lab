name: Validar web y contenedor
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JavaScript
        run: node --check app.js
      - name: Construir y probar imagen
        run: bash scripts/test-container.sh
